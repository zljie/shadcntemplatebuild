        - dialect: ANSI_SQL
          expression: purchase_budget.allocated_amount
    - name: reserved_amount
      type: Number
      description: 未验收订单剩余承诺金额
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: purchase_budget.reserved_amount
    - name: spent_amount
      type: Number
      description: 已验收采购金额，非财务付款金额
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: purchase_budget.spent_amount
    - name: currency
      type: String
      description: CNY
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: purchase_budget.currency
    - name: status
      type: String
      description: OPEN/CLOSED
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: purchase_budget.status
  - name: purchase_request
    source: semantic.purchase_request
    primary_key: &id011
    - request_id
    description: 针对一个书目的一条采购申请；拟建概念接入视图，真实表/API 待映射。
    ai_context:
      synonyms:
      - 采购申请
    fields:
    - name: request_id
      type: String
      description: 申请ID
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: purchase_request.request_id
    - name: title_id
      type: String
      description: 书目ID
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: purchase_request.title_id
    - name: requester_id
      type: String
      description: 申请人ID
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: purchase_request.requester_id
    - name: budget_id
      type: String
      description: 预算ID
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: purchase_request.budget_id
    - name: quantity
      type: Integer
      description: 申请册数
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: purchase_request.quantity
    - name: estimated_unit_price
      type: Number
      description: 预估单价
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: purchase_request.estimated_unit_price
    - name: reason
      type: String
      description: 采购理由
      expression:
