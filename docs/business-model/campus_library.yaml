      description: 不写approval_task。创建审计outcome=PENDING的人工处置记录（object_type=loan），按loan_id去重；通知渠道尚未接入，不声称已发送消息。
      labels:
      - command
      - transactional
      io_schema:
        input_schema:
          type: object
          additionalProperties: false
          properties:
            loan_id:
              type: string
              minLength: 1
            assigned_to:
              type: string
              minLength: 1
            request_id:
              type: string
              minLength: 1
              description: 幂等请求ID
            preview_only:
              type: boolean
              default: true
          required:
          - loan_id
          - assigned_to
          - request_id
          - preview_only
        output_schema:
          type: object
          additionalProperties: false
          properties:
            status:
              type: string
              minLength: 1
              enum:
              - SUCCEEDED
              - REJECTED
              - FAILED
              - PENDING
            data:
              type: object
              additionalProperties: true
            evidence_ref:
              type: string
              minLength: 1
          required:
          - status
          - data
          - evidence_ref
      authorization:
        allowed_roles:
        - LIBRARIAN
        actor_source: trusted_session
        reader_scope: self_only; book_title/book_copy public projections; no audit, staff roles, supplier or procurement
          access
      governance:
        risk: LOW
        approval: 无需采购审批；此处使用独立审计待办，非审批任务。
        execution: preview → authorize → validate rules → approval if required → transactional write → readback
          → append audit
        idempotency: request_id identifies actor+action+canonical payload; identical retry returns original result;
          conflicting payload rejected
        audit_required: true
    - id: library_approval_request
      name: 提交政策、角色或取消审批
      kind: command
      operation: approval_request
      entity_name: approval_task
      applies_to:
        entity: dataset
        dataset: approval_task
      description: 只支持POLICY_PUBLISH/ROLE_GRANT/ORDER_CANCEL。政策和订单必须存在且状态适用；角色授予object_id为目标user_id，role_code必填，服务端生成快照与摘要。验证独立APPROVER，创建绑定意图、版本及内容的PENDING任务；拒绝重复待审同意图。所有提交人均从可信会话取得。
      labels:
      - command
      - transactional
      io_schema:
        input_schema:
          type: object
          additionalProperties: false
          properties:
            action_intent:
              type: string
              enum:
              - POLICY_PUBLISH
              - ROLE_GRANT
              - ORDER_CANCEL
            object_id:
              type: string
              minLength: 1
            role_code:
              type: string
              enum:
              - LIBRARIAN
              - BUYER
              - APPROVER
              - ADMIN
            assigned_to:
              type: string
              minLength: 1
            reason:
              type: string
              minLength: 1
            request_id:
              type: string
              minLength: 1
            preview_only:
              type: boolean
              default: true
          required:
          - action_intent
          - object_id
          - assigned_to
          - reason
          - request_id
          - preview_only
        output_schema:
          type: object
          additionalProperties: false
          properties:
            status:
              type: string
              minLength: 1
              enum:
              - SUCCEEDED
              - REJECTED
              - FAILED
              - PENDING
            data:
              type: object
              additionalProperties: true
            evidence_ref:
              type: string
              minLength: 1
          required:
          - status
          - data
          - evidence_ref
      authorization:
        allowed_roles:
        - ADMIN
        - BUYER
        actor_source: trusted_session
        reader_scope: self_only; book_title/book_copy public projections; no audit, staff roles, supplier or procurement
          access
      governance:
        risk: MEDIUM
        approval: 仅创建PENDING任务，不代表已获批准；后续必须library_approval_decide。
        execution: preview → authorize → validate rules → approval if required → transactional write → readback
          → append audit
        idempotency: request_id identifies actor+action+canonical payload; identical retry returns original result;
          conflicting payload rejected
        audit_required: true
    rules:
    - id: rule/trusted_role_and_scope
      name: 可信身份与最小权限
      severity: error
      when:
        entity: action
        action_ids: []
        condition: session is authenticated AND effective role authorizes action AND row/field scope is enforced
      constraint:
        type: business_guard
        field: user_role.user_role_id
        predicate: session is authenticated AND effective role authorizes action AND row/field scope is enforced
        enforcement: server side; transactional if concurrent; fail closed
      applies_to:
        dataset: user_role
      message: 自报actor/role不构成授权，读者不能读取他人记录、采购和审计。
      remediation: 从身份服务恢复角色，限制对象与字段。
    - id: rule/valid_data_before_write
      name: 写入前数据校验
      severity: error
      when:
        entity: action
        action_ids: []
        condition: input schema valid AND foreign keys exist AND lifecycle transition valid
      constraint:
        type: business_guard
        field: audit_event.audit_id
        predicate: input schema valid AND foreign keys exist AND lifecycle transition valid
        enforcement: server side; transactional if concurrent; fail closed
      applies_to:
        dataset: audit_event
      message: 无效数据不能发布或写回；拒绝也须审计。
      remediation: 修正输入或对象状态。
    - id: rule/unique_copy_loan
      name: 一个副本仅一个在借
      severity: error
      when:
        entity: action
        action_ids:
        - library_loan_borrow
        condition: COUNT(OPEN loans for copy_id) <= 1 AND copy status agrees with loan state
      constraint:
        type: business_guard
        field: loan.loan_id
        predicate: COUNT(OPEN loans for copy_id) <= 1 AND copy status agrees with loan state
        enforcement: server side; transactional if concurrent; fail closed
      applies_to:
        dataset: loan
      message: 并发借出只能一次成功。
      remediation: 数据库条件唯一约束/锁与事务；用户限额须同时锁读者。
    - id: rule/eligible_borrower
      name: 读者资格和限额
      severity: error
      when:
        entity: action
        action_ids:
        - library_loan_borrow
        condition: ACTIVE reader AND ACTIVE READER role AND active policy AND open_count < max_open_loans AND overdue
          policy satisfied
      constraint:
        type: business_guard
        field: library_user.user_id
        predicate: ACTIVE reader AND ACTIVE READER role AND active policy AND open_count < max_open_loans AND overdue
          policy satisfied
        enforcement: server side; transactional if concurrent; fail closed
      applies_to:
        dataset: library_user
      message: 暂停、失效资格、超限或逾期门禁均阻止新借出。
      remediation: 核实资格/归还图书，正常归还不受此门禁。
    - id: rule/copy_available
      name: 副本可借状态
      severity: error
      when:
        entity: action
        action_ids:
        - library_loan_borrow
        condition: book_copy.status = AVAILABLE AND book_title.status = ACTIVE
      constraint:
        type: business_guard
        field: book_copy.copy_id
        predicate: book_copy.status = AVAILABLE AND book_title.status = ACTIVE
        enforcement: server side; transactional if concurrent; fail closed
      applies_to:
        dataset: book_copy
      message: 遗失、损坏、撤藏或已借出副本不能借出。
      remediation: 选择其他可借副本。
    - id: rule/renewal_guard
      name: 续借限制
      severity: error
      when:
        entity: action
        action_ids:
        - library_loan_renew
        condition: OPEN AND active authorized reader AND due_at >= server_time AND renewal_count < policy.max_renewals
      constraint:
        type: business_guard
        field: loan.loan_id
        predicate: OPEN AND active authorized reader AND due_at >= server_time AND renewal_count < policy.max_renewals
        enforcement: server side; transactional if concurrent; fail closed
      applies_to:
        dataset: loan
      message: 到期时刻之前或等于可续借；已逾期/次数耗尽拒绝。
      remediation: 归还或人工核实；未来引入预约时补充预约阻断。
    - id: rule/loan_temporal_integrity
      name: 借阅时间与状态一致
      severity: error
      when:
        entity: action
        action_ids: []
        condition: borrowed_at <= due_at AND borrowed_at <= as_of AND RETURNED implies returned_at=closed_at >=
          borrowed_at AND OPEN implies returned_at/closed_at null AND LOST implies closed_at set and returned_at
          null
      constraint:
        type: business_guard
        field: loan.loan_id
        predicate: borrowed_at <= due_at AND borrowed_at <= as_of AND RETURNED implies returned_at=closed_at >=
          borrowed_at AND OPEN implies returned_at/closed_at null AND LOST implies closed_at set and returned_at
          null
        enforcement: server side; transactional if concurrent; fail closed
      applies_to:
        dataset: loan
      message: 状态与时间不一致记录不可进入看板。
      remediation: 修正来源数据并保留修正审计。
    - id: rule/policy_immutable
      name: 借阅政策版本不可改写
      severity: error
      when:
        entity: action
        action_ids: []
        condition: used policy version immutable AND limits valid AND publish has approved task
      constraint:
        type: business_guard
        field: loan_policy.policy_id
        predicate: used policy version immutable AND limits valid AND publish has approved task
        enforcement: server side; transactional if concurrent; fail closed
      applies_to:
        dataset: loan_policy
      message: 政策变更不得改写历史到期时间。
      remediation: 新建政策版本，确认并审批后发布。
    - id: rule/independent_approval
      name: 审批独立且绑定版本意图
      severity: error
      when:
        entity: action
        action_ids: []
        condition: APPROVED task matches object_id, object_revision, action intent AND assigned approver != requested_by
          AND role ACTIVE
      constraint:
        type: business_guard
        field: approval_task.task_id
        predicate: APPROVED task matches object_id, object_revision, action intent AND assigned approver != requested_by
          AND role ACTIVE
        enforcement: server side; transactional if concurrent; fail closed
      applies_to:
        dataset: approval_task
      message: 缺审批、版本失效、自批或错误意图均不能高风险写入。
      remediation: 独立指定审批人，重新提交；取消意图记录在审计source_ref和审批decision_reason。
    - id: rule/supplier_not_blocked
      name: 阻断供应商不能下单
      severity: error
      when:
        entity: action
        action_ids:
        - library_purchase_order_submit
        - library_purchase_order_issue
        condition: supplier.status = ACTIVE
      constraint:
        type: business_guard
        field: supplier.supplier_id
        predicate: supplier.status = ACTIVE
        enforcement: server side; transactional if concurrent; fail closed
      applies_to:
        dataset: supplier
      message: 阻断供应商不能提交或正式下单。
      remediation: 选择有效供应商或走供应商治理流程。
    - id: rule/budget_atomic_guard
      name: 预算预占与人工复核
      severity: error
      when:
        entity: action
        action_ids: []
        condition: allocated >= reserved + spent AND budget OPEN AND order.amount <= available; receipt transfers
          reserved to spent atomically
      constraint:
        type: business_guard
        field: purchase_budget.budget_id
        predicate: allocated >= reserved + spent AND budget OPEN AND order.amount <= available; receipt transfers
          reserved to spent atomically
        enforcement: server side; transactional if concurrent; fail closed
      applies_to:
        dataset: purchase_budget
      message: 超预算拒绝，不绕过余额；补充预算需校方人工批准。
      remediation: 补充预算或减少采购，批准后重新提交。
    - id: rule/approved_request_order_once
      name: 申请审批与重复采购
      severity: error
      when:
        entity: action
        action_ids: []
        condition: current request APPROVED AND same title/budget/quantity AND at most one live issued order line
          per request
      constraint:
        type: business_guard
        field: purchase_request.request_id
        predicate: current request APPROVED AND same title/budget/quantity AND at most one live issued order line
          per request
        enforcement: server side; transactional if concurrent; fail closed
      applies_to:
        dataset: purchase_request
      message: 未审批申请不能下单，同申请不能重复下单。
      remediation: 取消原订单并回读后才可重新下单。
    - id: rule/order_total_integrity
      name: 订单金额一致
      severity: error
      when:
        entity: action
        action_ids: []
        condition: total_amount = SUM(line.quantity * line.unit_price) AND quantity > 0 AND unit_price > 0 AND CNY
      constraint:
        type: business_guard
        field: purchase_order.order_id
        predicate: total_amount = SUM(line.quantity * line.unit_price) AND quantity > 0 AND unit_price > 0 AND CNY
        enforcement: server side; transactional if concurrent; fail closed
      applies_to:
        dataset: purchase_order
      message: 单价、数量、金额或币种不一致不得提交。
      remediation: 修正草稿并重新审批。
    - id: rule/receipt_quantity_guard
      name: 到货累计数量门禁
      severity: error
      when:
        entity: action
        action_ids: []
        condition: sum(receipt.accepted_quantity) = line.received_quantity <= line.quantity
      constraint:
        type: business_guard
        field: receipt.receipt_id
        predicate: sum(receipt.accepted_quantity) = line.received_quantity <= line.quantity
        enforcement: server side; transactional if concurrent; fail closed
      applies_to:
        dataset: receipt
      message: 累计验收超量拒绝，包括并发到货。
      remediation: 锁明细后重查；拒收部分不纳入合格数量。
    - id: rule/stock_traceability
      name: 采购入库可追溯
      severity: error
      when:
        entity: action
        action_ids: []
        condition: PURCHASE copy has receipt AND copy.title_id = receipt.line.title_id AND unique barcode AND receipt.stocked_quantity
          = count(copies) <= accepted_quantity
      constraint:
        type: business_guard
        field: book_copy.copy_id
        predicate: PURCHASE copy has receipt AND copy.title_id = receipt.line.title_id AND unique barcode AND receipt.stocked_quantity
          = count(copies) <= accepted_quantity
        enforcement: server side; transactional if concurrent; fail closed
      applies_to:
        dataset: book_copy
      message: 无验收、重复条码、错书目或超数量不能入库。
      remediation: 修正批次/条码并重试；LEGACY来源单独标注。
    - id: rule/return_not_blocked
      name: 归还与损坏处理
      severity: error
      when:
        entity: action
        action_ids:
        - library_loan_return
        condition: OPEN loan can return even if borrower SUSPENDED or overdue; DAMAGED needs reason
      constraint:
        type: business_guard
        field: loan.loan_id
        predicate: OPEN loan can return even if borrower SUSPENDED or overdue; DAMAGED needs reason
        enforcement: server side; transactional if concurrent; fail closed
      applies_to:
        dataset: loan
      message: 不得因资格暂停而阻止归还。损坏副本不能重新变AVAILABLE。
      remediation: 登记损坏，后续赔偿另行处理。
    - id: rule/overdue_requires_followup
      name: 逾期生成处置待办
      severity: warn
      when:
        entity: action
        action_ids: []
        condition: OPEN and due_at < as_of requires deduplicated pending followup audit by loan_id
      constraint:
        type: business_guard
        field: loan.loan_id
        predicate: OPEN and due_at < as_of requires deduplicated pending followup audit by loan_id
        enforcement: server side; transactional if concurrent; fail closed
      applies_to:
        dataset: loan
      message: 逾期需馆员处置待办；未接消息服务时只报告待办已创建。
      remediation: 调用library_overdue_task_create并记录责任人和结果。
    - id: rule/writeback_audit
      name: 外部写回审计与回读
      severity: error
      when:
        entity: action
        action_ids: []
        condition: all commands append audit; external success requires readback result_ref; unresolved is PENDING;
          sensitive input redacted
      constraint:
        type: business_guard
        field: audit_event.audit_id
        predicate: all commands append audit; external success requires readback result_ref; unresolved is PENDING;
          sensitive input redacted
        enforcement: server side; transactional if concurrent; fail closed
      applies_to:
        dataset: audit_event
      message: 没有回读证据不得声称外部动作成功。
      remediation: 核对外部引用，记录失败或补偿；审计追加不修改。
    - id: rule/dashboard_grain
      name: 看板事实粒度与可重算
      severity: error
      when:
        entity: action
        action_ids: []
        condition: start < end <= as_of AND aggregates use independent fact grains AND Shanghai timezone; unavailable
          historical snapshot rejected
      constraint:
        type: business_guard
        field: loan.loan_id
        predicate: start < end <= as_of AND aggregates use independent fact grains AND Shanghai timezone; unavailable
          historical snapshot rejected
        enforcement: server side; transactional if concurrent; fail closed
      applies_to:
        dataset: loan
      message: 禁止采购多批次、借阅多事件造成重复计数；禁止用当前状态冒充历史快照。
      remediation: 分开聚合再连接；使用可重建快照或当前时刻。
    metadata:
      implementation_status: conceptual_contract_not_deployed
      approval_binding: 任务包含action_intent、object_snapshot、content_hash；采购绑定revision，政策使用不可变policy_id，角色object_id为目标user_id。服务端校验批准快照和当前内容一致。
      system_of_record: 拟建library服务负责主数据/借阅；采购服务负责采购/预算；审批服务负责任务；审计服务追加日志。真实系统与API待确认。
