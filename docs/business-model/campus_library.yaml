        - dialect: ANSI_SQL
          expression: purchase_request.reason
    - name: status
      type: String
      description: DRAFT/SUBMITTED/APPROVED/REJECTED/ORDERED/CANCELLED
      expression:
        dialects:
        - dialect: ANSI_SQL
