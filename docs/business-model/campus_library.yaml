      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: purchase_request.revision
  - name: purchase_order
    source: semantic.purchase_order
    primary_key: &id010
    - order_id
    description: 一个供应商的一张采购订单；同一预算；拟建概念接入视图，真实表/API 待映射。
    ai_context:
      synonyms:
      - 采购订单
    fields:
    - name: order_id
      type: String
      description: 订单ID
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: purchase_order.order_id
    - name: supplier_id
      type: String
      description: 供应商ID
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: purchase_order.supplier_id
    - name: buyer_id
      type: String
      description: 采购员ID
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: purchase_order.buyer_id
    - name: budget_id
      type: String
      description: 预算ID
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: purchase_order.budget_id
    - name: status
      type: String
      description: DRAFT/SUBMITTED/APPROVED/ISSUED/PART_RECEIVED/RECEIVED/CANCELLED
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: purchase_order.status
    - name: ordered_at
      type: DateTime
      description: 正式下单时间可空
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: purchase_order.ordered_at
      dimension:
        is_time: true
    - name: total_amount
      type: Number
      description: 明细 quantity × unit_price 之和
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: purchase_order.total_amount
    - name: currency
      type: String
      description: CNY
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: purchase_order.currency
    - name: approval_task_id
      type: String
      description: 批准当前版本的任务ID可空
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: purchase_order.approval_task_id
    - name: revision
      type: Integer
      description: 订单内容版本
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: purchase_order.revision
  - name: purchase_order_line
    source: semantic.purchase_order_line
