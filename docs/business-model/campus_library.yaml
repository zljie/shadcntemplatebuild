version: 0.1.2
semantic_model:
- name: campus_library
  description: 校园图书馆用户、书目与副本、借还续借、采购入库及借阅运营分析概念模型。接口尚待实现。
  ai_context:
    synonyms:
    - 校园图书馆
    - 图书借阅系统
    instructions: 所有 semantic.* 均为拟建语义视图，非已存在数据源。Asia/Shanghai；时间区间左闭右开。在借=OPEN 且 returned_at IS NULL；逾期另按 due_at
      < as_of 判定，不作为持久化状态。借阅粒度为一次借出一个副本。聚合先在事实粒度计算，禁止一对多 join 放大。读者仅可访问自身借阅与公共书目；全部权限由可信身份服务执行，输入不得自报角色。所有命令先预览，再权限/规则校验，必要审批，事务写回、回读并审计；声明性规则不代表已部署执行器。
    examples:
    - 我现在借了哪些书，什么时候归还？
    - 这本书还有哪些可借副本？
    - 本月借出量、活跃读者和热门书目是什么？
    - 哪些借阅已经逾期？
    - 某采购订单到货多少，入库副本来自哪次验收？
  datasets:
  - name: library_user
    source: semantic.library_user
    primary_key: &id002
    - user_id
    description: 一条用户记录；读者类型与员工角色分离；拟建概念接入视图，真实表/API 待映射。
    ai_context:
      synonyms:
      - 用户
    fields:
    - name: user_id
      type: String
      description: 用户ID
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: library_user.user_id
    - name: campus_no
      type: String
      description: 学号或工号
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: library_user.campus_no
    - name: display_name
      type: String
      description: 姓名
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: library_user.display_name
    - name: reader_type
      type: String
      description: STUDENT/STAFF/NONE
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: library_user.reader_type
    - name: department
      type: String
      description: 院系部门
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: library_user.department
    - name: status
      type: String
      description: ACTIVE/SUSPENDED/CLOSED
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: library_user.status
    - name: policy_id
      type: String
      description: 借阅政策ID，非读者可为空
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: library_user.policy_id
    - name: created_at
      type: DateTime
      description: 建档时间
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: library_user.created_at
      dimension:
        is_time: true
    unique_keys:
    - - campus_no
  - name: user_role
    source: semantic.user_role
    primary_key:
    - user_role_id
    description: 一个用户的一个有效角色授予；拟建概念接入视图，真实表/API 待映射。
    ai_context:
      synonyms:
      - 角色授权
    fields:
    - name: user_role_id
      type: String
      description: 授予ID
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: user_role.user_role_id
    - name: user_id
      type: String
      description: 用户ID
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: user_role.user_id
    - name: role_code
      type: String
      description: READER/LIBRARIAN/BUYER/APPROVER/ADMIN
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: user_role.role_code
    - name: status
      type: String
      description: ACTIVE/REVOKED
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: user_role.status
    - name: granted_by
      type: String
      description: 授予人ID
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: user_role.granted_by
    - name: granted_at
      type: DateTime
      description: 授予时间
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: user_role.granted_at
      dimension:
        is_time: true
    unique_keys:
    - - user_id
      - role_code
  - name: loan_policy
    source: semantic.loan_policy
    primary_key: &id001
    - policy_id
    description: 一条版本化借阅政策；使用中版本不可原地修改；拟建概念接入视图，真实表/API 待映射。
    ai_context:
      synonyms:
      - 借阅政策
    fields:
    - name: policy_id
      type: String
      description: 政策版本ID
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: loan_policy.policy_id
    - name: policy_name
      type: String
      description: 政策名称
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: loan_policy.policy_name
    - name: max_open_loans
      type: Integer
      description: 最大在借册数
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: loan_policy.max_open_loans
    - name: loan_days
      type: Integer
      description: 借期天数
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: loan_policy.loan_days
    - name: max_renewals
      type: Integer
      description: 最大续借次数
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: loan_policy.max_renewals
    - name: renew_days
      type: Integer
      description: 每次续借天数
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: loan_policy.renew_days
    - name: block_if_overdue
      type: Boolean
      description: 有逾期时阻止借出和续借
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: loan_policy.block_if_overdue
    - name: status
      type: String
      description: DRAFT/ACTIVE/RETIRED
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: loan_policy.status
    - name: effective_from
      type: DateTime
      description: 生效时间
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: loan_policy.effective_from
      dimension:
        is_time: true
    - name: effective_to
      type: DateTime
      description: 失效时间可为空
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: loan_policy.effective_to
      dimension:
        is_time: true
  - name: book_title
    source: semantic.book_title
    primary_key: &id003
    - title_id
    description: 一个出版版本的书目，不等于实体书；拟建概念接入视图，真实表/API 待映射。
    ai_context:
      synonyms:
      - 书目
    fields:
    - name: title_id
      type: String
      description: 书目ID
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: book_title.title_id
    - name: isbn
      type: String
      description: ISBN，可空且不假设全球唯一
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: book_title.isbn
    - name: title
      type: String
      description: 书名
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: book_title.title
    - name: author
      type: String
      description: 作者
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: book_title.author
    - name: publisher
      type: String
      description: 出版社
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: book_title.publisher
    - name: edition
      type: String
      description: 版次
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: book_title.edition
    - name: category
      type: String
      description: 分类
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: book_title.category
    - name: status
      type: String
      description: ACTIVE/ARCHIVED
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: book_title.status
    - name: created_at
      type: DateTime
      description: 创建时间
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: book_title.created_at
      dimension:
        is_time: true
  - name: book_copy
    source: semantic.book_copy
    primary_key: &id005
    - copy_id
    description: 一册实体图书；拟建概念接入视图，真实表/API 待映射。
    ai_context:
      synonyms:
      - 馆藏副本
    fields:
    - name: copy_id
      type: String
      description: 副本ID
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: book_copy.copy_id
    - name: barcode
      type: String
      description: 唯一条码
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: book_copy.barcode
    - name: title_id
      type: String
      description: 书目ID
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: book_copy.title_id
    - name: location
      type: String
      description: 馆藏位置
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: book_copy.location
    - name: status
      type: String
      description: AVAILABLE/ON_LOAN/DAMAGED/LOST/WITHDRAWN
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: book_copy.status
    - name: acquired_at
      type: DateTime
      description: 入库时间
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: book_copy.acquired_at
      dimension:
        is_time: true
    - name: receipt_id
      type: String
      description: 采购验收ID，历史导入可空
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: book_copy.receipt_id
    - name: source_type
      type: String
      description: PURCHASE/LEGACY
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: book_copy.source_type
    - name: replacement_cost
      type: Number
      description: 参考赔偿价值，不代表应收款
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: book_copy.replacement_cost
    unique_keys:
    - - barcode
  - name: loan
    source: semantic.loan
    primary_key: &id006
    - loan_id
    description: 一次向一位读者借出一个副本；拟建概念接入视图，真实表/API 待映射。
    ai_context:
      synonyms:
      - 借阅
    fields:
    - name: loan_id
      type: String
      description: 借阅ID
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: loan.loan_id
    - name: user_id
      type: String
      description: 读者ID
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: loan.user_id
    - name: copy_id
      type: String
      description: 副本ID
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: loan.copy_id
    - name: policy_id
      type: String
      description: 借出时的政策版本
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: loan.policy_id
    - name: borrowed_at
      type: DateTime
      description: 借出时间
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: loan.borrowed_at
      dimension:
        is_time: true
    - name: due_at
      type: DateTime
      description: 当前应还时间
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: loan.due_at
      dimension:
        is_time: true
    - name: returned_at
      type: DateTime
      description: 归还时间可空
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: loan.returned_at
      dimension:
        is_time: true
    - name: status
      type: String
      description: OPEN/RETURNED/LOST
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: loan.status
    - name: renewal_count
      type: Integer
      description: 续借次数
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: loan.renewal_count
    - name: closed_at
      type: DateTime
      description: 结清时间可空，LOST须有值
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: loan.closed_at
      dimension:
        is_time: true
    - name: borrowed_by
      type: String
      description: 办理馆员ID
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: loan.borrowed_by
  - name: loan_event
    source: semantic.loan_event
    primary_key:
    - event_id
    description: 一次借出、归还、续借、遗失或损坏登记事件；拟建概念接入视图，真实表/API 待映射。
    ai_context:
      synonyms:
      - 借阅事件
    fields:
    - name: event_id
      type: String
      description: 事件ID
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: loan_event.event_id
    - name: loan_id
      type: String
      description: 借阅ID
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: loan_event.loan_id
    - name: event_type
      type: String
      description: BORROW/RETURN/RENEW/REPORT_LOST/REPORT_DAMAGE
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: loan_event.event_type
    - name: occurred_at
      type: DateTime
      description: 事件时间
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: loan_event.occurred_at
      dimension:
        is_time: true
    - name: actor_id
      type: String
      description: 可信办理人ID
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: loan_event.actor_id
    - name: previous_due_at
      type: DateTime
      description: 续借前应还时间可空
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: loan_event.previous_due_at
      dimension:
        is_time: true
    - name: new_due_at
      type: DateTime
      description: 续借后应还时间可空
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: loan_event.new_due_at
      dimension:
        is_time: true
    - name: condition
      type: String
      description: NORMAL/DAMAGED/LOST或空
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: loan_event.condition
    - name: reason
      type: String
      description: 原因说明
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: loan_event.reason
  - name: supplier
    source: semantic.supplier
    primary_key: &id009
    - supplier_id
    description: 一个图书供应商；拟建概念接入视图，真实表/API 待映射。
    ai_context:
      synonyms:
      - 供应商
    fields:
    - name: supplier_id
      type: String
      description: 供应商ID
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: supplier.supplier_id
    - name: supplier_name
      type: String
      description: 供应商名称
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: supplier.supplier_name
    - name: status
      type: String
      description: ACTIVE/BLOCKED
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: supplier.status
    - name: contact
      type: String
      description: 业务联系方式，受限信息
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: supplier.contact
  - name: purchase_budget
    source: semantic.purchase_budget
    primary_key: &id007
    - budget_id
    description: 一个预算周期的采购额度；单币种 CNY；拟建概念接入视图，真实表/API 待映射。
    ai_context:
      synonyms:
      - 采购预算
    fields:
    - name: budget_id
      type: String
      description: 预算ID
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: purchase_budget.budget_id
    - name: budget_name
      type: String
      description: 预算名称
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: purchase_budget.budget_name
    - name: period_start
      type: Date
      description: 周期开始
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: purchase_budget.period_start
      dimension:
        is_time: true
    - name: period_end
      type: Date
      description: 周期结束排他
