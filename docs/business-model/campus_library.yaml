      kind: query
      operation: borrow_dashboard
      entity_name: loan
      applies_to:
        entity: dataset
        dataset: loan
        datasets:
        - loan
        - book_copy
        - book_title
      description: 验证 start_at < end_at <= as_of。当前在借/逾期取 as_of 一致快照，不受期间过滤。期间指标按借出时间；归还量按归还时间。热门按 title_borrow_count
        降序、title_id 升序；趋势按上海日期补零。不输出读者个人信息。as_of 非当前时须有可重建历史快照，否则拒绝。
      labels:
      - query
      - analytics
      io_schema:
        input_schema:
          type: object
          additionalProperties: false
          properties:
            start_at:
              type: string
              minLength: 1
              format: date-time
            end_at:
              type: string
              minLength: 1
              format: date-time
            as_of:
              type: string
              minLength: 1
              format: date-time
            top_n:
              type: integer
              minimum: 1
              maximum: 20
              default: 5
          required:
          - start_at
          - end_at
          - as_of
        output_schema:
          type: object
          additionalProperties: false
          properties:
            status:
              type: string
              minLength: 1
              enum:
              - SUCCEEDED
              - REJECTED
              - FAILED
              - PENDING
            data:
              type: object
              additionalProperties: true
            evidence_ref:
              type: string
              minLength: 1
          required:
          - status
          - data
          - evidence_ref
      authorization:
        allowed_roles:
        - LIBRARIAN
