  metrics:
  - name: open_loan_count
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: COUNT(CASE WHEN loan.status = 'OPEN' AND loan.returned_at IS NULL THEN loan.loan_id END)
    description: 当前快照全部在借，独立于期间过滤；loan 单行粒度，拒绝未来借出与状态时间不一致记录。
  - name: overdue_loan_count
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: COUNT(CASE WHEN loan.status = 'OPEN' AND loan.returned_at IS NULL AND loan.due_at < CURRENT_TIMESTAMP
          THEN loan.loan_id END)
    description: 当前快照逾期；due_at 等于观察时刻尚不逾期；生产 CURRENT_TIMESTAMP=服务端观察时刻，演示固定 as_of。
  - name: period_borrow_count
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: COUNT(loan.loan_id)
    description: 先按 borrowed_at 筛选 [start_at,end_at)，然后 COUNT；归还、遗失记录仍计入历史借出。
  - name: period_active_readers
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: COUNT(DISTINCT loan.user_id)
    description: 先按 borrowed_at 筛选 [start_at,end_at)，借书读者去重；不是所有注册用户或仍在借用户。
  - name: title_borrow_count
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: COUNT(loan.loan_id)
    description: loan→book_copy→book_title 多对一连接；按借出期间过滤并按 title_id 分组，按册次计数，降序、title_id升序并列。
  - name: daily_borrow_count
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: COUNT(loan.loan_id)
    description: 按 borrowed_at 的上海本地日期分组，补零后展示；按期间过滤，按日期升序。
  - name: available_copy_count
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: COUNT(CASE WHEN book_copy.status = 'AVAILABLE' THEN book_copy.copy_id END)
    description: 当前可借副本，按 title_id 可分组；书目必须 ACTIVE，关闭书目不得有 AVAILABLE 副本。
  - name: period_return_count
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: COUNT(CASE WHEN loan.status = 'RETURNED' THEN loan.loan_id END)
    description: 先按 returned_at 筛选 [start_at,end_at)，loan 单行粒度。
  - name: budget_available_amount
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: SUM(purchase_budget.allocated_amount - purchase_budget.reserved_amount - purchase_budget.spent_amount)
    description: 预算单行粒度，OPEN 预算；reserved 为剩余承诺，spent 为验收金额；禁止连接明细后重复累加。
  - name: ordered_copy_count
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: SUM(purchase_order_line.quantity)
    description: 按指定订单筛选明细，不连接多批次验收后再累加。
  - name: accepted_copy_count
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: SUM(receipt.accepted_quantity)
    description: 按指定订单沿 receipt→line→order 多对一过滤；只计算 ACCEPTED/STOCKED，每批验收一行。
  - name: stocked_copy_count
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: COUNT(book_copy.copy_id)
    description: 按采购订单沿副本→验收→明细→订单过滤，仅 source_type='PURCHASE'；不等同验收合格数量。
  behavior:
    namespace: campus_library
    behavior_layer_version: '0.1'
    actions:
    - id: library_user_get_by_id
      name: 按ID查询用户
      kind: query
      operation: get_by_id
      entity_name: library_user
      applies_to:
        entity: dataset
        dataset: library_user
      description: 只读。按可信身份限制记录范围及返回字段；读者本人用户资料、本人借阅及事件、公共书目和副本投影。
      labels:
      - query
      - master_data
      io_schema:
        input_schema:
          type: object
          additionalProperties: false
          properties:
            user_id:
              type: string
              minLength: 1
          required:
          - user_id
        output_schema:
          type: object
          additionalProperties: false
          properties:
            status:
              type: string
              minLength: 1
              enum:
              - SUCCEEDED
              - REJECTED
              - FAILED
              - PENDING
            data:
              type: object
              additionalProperties: true
            evidence_ref:
              type: string
              minLength: 1
          required:
          - status
          - data
          - evidence_ref
      authorization:
        allowed_roles: &id013
        - READER
        - LIBRARIAN
        - ADMIN
        actor_source: trusted_session
        reader_scope: self_only; book_title/book_copy public projections; no audit, staff roles, supplier or procurement
          access
    - id: library_user_list
      name: 分页列出用户
      kind: query
      operation: list
      entity_name: library_user
      applies_to:
        entity: dataset
        dataset: library_user
      description: 精确字段过滤，按主键升序稳定分页。时间字段等值过滤；业务范围查询使用专用 query action。不可通过 user_id 越过自身范围。
      labels:
      - query
      - master_data
      io_schema:
        input_schema:
          type: object
          additionalProperties: false
          properties:
            page:
              type: integer
              minimum: 1
              default: 1
            page_size:
              type: integer
              minimum: 1
              maximum: 100
              default: 20
            user_id:
              type: string
              minLength: 1
            campus_no:
              type: string
              minLength: 1
            display_name:
              type: string
              minLength: 1
            reader_type:
              type: string
              minLength: 1
            department:
              type: string
              minLength: 1
            status:
              type: string
              minLength: 1
            policy_id:
              type: string
              minLength: 1
            created_at:
              type: string
              minLength: 1
          required: []
        output_schema:
          type: object
          additionalProperties: false
          properties:
            status:
              type: string
              minLength: 1
              enum:
              - SUCCEEDED
              - REJECTED
              - FAILED
              - PENDING
            data:
              type: object
              additionalProperties: true
            evidence_ref:
              type: string
              minLength: 1
          required:
          - status
          - data
          - evidence_ref
      authorization:
        allowed_roles: *id013
        actor_source: trusted_session
        reader_scope: self_only; book_title/book_copy public projections; no audit, staff roles, supplier or procurement
          access
    - id: user_role_get_by_id
      name: 按ID查询角色授权
      kind: query
      operation: get_by_id
      entity_name: user_role
      applies_to:
        entity: dataset
        dataset: user_role
      description: 只读。按可信身份限制记录范围及返回字段；读者本人用户资料、本人借阅及事件、公共书目和副本投影。
      labels:
      - query
      - master_data
      io_schema:
        input_schema:
          type: object
          additionalProperties: false
          properties:
            user_role_id:
              type: string
              minLength: 1
          required:
          - user_role_id
        output_schema:
          type: object
          additionalProperties: false
          properties:
            status:
              type: string
              minLength: 1
              enum:
              - SUCCEEDED
              - REJECTED
              - FAILED
              - PENDING
            data:
              type: object
              additionalProperties: true
            evidence_ref:
